name: AI Paper Trading Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Stiahnuť repozitár
        uses: actions/checkout@v4

      - name: Nastaviť Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Nainštalovať závislosti
        run: |
          python -m pip install --upgrade pip
          pip install yfinance openai pandas numpy

      - name: Spustiť AI Agenta
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -u agent.py

      - name: Uložiť databázu do GitHube
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase || true
          git add paper_trading.db
          git commit -m "Auto-update paper trading DB" || echo "No changes"
          git push origin main
