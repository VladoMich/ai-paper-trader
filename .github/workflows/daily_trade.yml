name: Paper Trader

on:
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance openai pandas numpy

      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -u agent.py

      - name: Push database to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Stiahneme aktuálny stav z remote a vyriešime konflikty rebasom
          git pull origin main --rebase || true
          
          # Skontrolujeme, či súbor existuje
          ls -la paper_trading.db
          
          git add paper_trading.db
          git commit -m "Update paper trading database" || echo "No changes to commit"
          git push origin main
