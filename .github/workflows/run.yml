name: AI Paper Trading Daily Run

on:
  schedule:
    # Spustí sa každý deň o 8:00 UTC (uprav si čas podľa potreby)
    - cron: '0 8 * * *'
  workflow_dispatch: # Umožňuje spustiť to kedykoľvek aj manuálne

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance google-genai pandas numpy

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u agent.py

      - name: Commit and push database changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add paper_trading.db
          git commit -m "Auto-update paper trading db [skip ci]" || echo "No changes to commit"
          git push
